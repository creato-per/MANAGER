<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUMMUS TV</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0d0d0f;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
    }

    header {
        background: #111114;
        border-bottom: 1px solid #29292e;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-content {
        max-width: 1200px;
        margin: auto;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .logo span {
        color: #990000;
    }

    .clock {
        text-align: right;
        color: #aaa;
        font-size: 13px;
    }

    .clock strong {
        display: block;
        color: #fff;
        font-size: 17px;
        margin-bottom: 3px;
    }

    main {
        max-width: 1200px;
        margin: auto;
        padding: 35px 20px 70px;
    }

    .intro {
        margin-bottom: 35px;
    }

    .intro h1 {
        margin: 0 0 8px;
        font-size: 34px;
    }

    .intro p {
        margin: 0;
        color: #999;
        line-height: 1.6;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 18px;
        padding: 7px 11px;
        border-radius: 6px;
        background: #171719;
        border: 1px solid #29292e;
        color: #999;
        font-size: 12px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #38a169;
    }

    .canal {
        margin-bottom: 55px;
    }

    .canal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
        padding-bottom: 13px;
        border-bottom: 1px solid #29292e;
    }

    .canal-info {
        display: flex;
        align-items: center;
        gap: 13px;
    }

    .canal-id {
        width: 48px;
        height: 48px;
        border-radius: 9px;
        background: #990000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: bold;
    }

    .canal-header h2 {
        margin: 0;
        font-size: 21px;
    }

    .canal-header p {
        margin: 4px 0 0;
        color: #777;
        font-size: 12px;
    }

    .faixa {
        color: #888;
        font-size: 12px;
        text-align: right;
    }

    .programa {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        min-height: 360px;
        background: #151518;
        border: 1px solid #29292e;
        border-radius: 13px;
        overflow: hidden;
    }

    .imagem {
        min-height: 360px;
        background: #08080a;
        position: relative;
    }

    .imagem img {
        width: 100%;
        height: 100%;
        min-height: 360px;
        object-fit: cover;
        display: block;
    }

    .imagem-sem {
        height: 100%;
        min-height: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: 13px;
    }

    .programa-info {
        padding: 35px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .tipo {
        display: inline-block;
        width: fit-content;
        padding: 6px 10px;
        border-radius: 5px;
        background: #990000;
        color: white;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 15px;
    }

    .programa-info h3 {
        margin: 0 0 15px;
        font-size: 30px;
        line-height: 1.15;
    }

    .programa-info .texto {
        margin: 0;
        color: #aaa;
        line-height: 1.7;
        font-size: 15px;
    }

    .agora {
        margin-top: 25px;
        padding-top: 17px;
        border-top: 1px solid #29292e;
        color: #777;
        font-size: 12px;
    }

    .agora strong {
        color: #ddd;
    }

    .erro,
    .vazio {
        padding: 30px;
        background: #151518;
        border: 1px solid #29292e;
        border-radius: 10px;
        color: #888;
    }

    .erro {
        color: #e7a3a3;
        border-color: #542323;
    }

    footer {
        border-top: 1px solid #29292e;
        padding: 25px 20px;
        text-align: center;
        color: #555;
        font-size: 11px;
    }

    @media (max-width: 800px) {
        .header-content {
            padding: 15px;
        }

        .logo {
            font-size: 21px;
        }

        main {
            padding: 25px 15px 50px;
        }

        .intro h1 {
            font-size: 28px;
        }

        .programa {
            grid-template-columns: 1fr;
        }

        .imagem,
        .imagem img,
        .imagem-sem {
            min-height: 240px;
            height: 240px;
        }

        .programa-info {
            padding: 25px;
        }

        .programa-info h3 {
            font-size: 25px;
        }

        .canal-header {
            align-items: flex-start;
        }

        .faixa {
            display: none;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-content">

        <div class="logo">
            SUMMUS <span>TV</span>
        </div>

        <div class="clock">
            <strong id="hora">--:--:--</strong>
            <span id="data">Carregando...</span>
        </div>

    </div>
</header>


<main>

    <section class="intro">

        <h1>Televisão</h1>

        <p>
            A programação dos principais canais de televisão do país,
            de acordo com o horário atual.
        </p>

        <div class="status">
            <span class="status-dot"></span>
            Programação ao vivo
        </div>

    </section>


    <section id="conteudo">

        <div class="vazio">
            Carregando programação...
        </div>

    </section>

</main>


<footer>
    SUMMUS TV • Sistema de comunicação
</footer>


<script>

let canais = [];
let programas = [];


/* =========================
   RELÓGIO
========================= */

function atualizarRelogio() {

    const agora = new Date();

    document.getElementById("hora").textContent =
        agora.toLocaleTimeString("pt-BR");

    document.getElementById("data").textContent =
        agora.toLocaleDateString("pt-BR", {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
}


/* =========================
   MINUTOS ATUAIS
========================= */

function minutosAtuais() {

    const agora = new Date();

    return agora.getHours() * 60 + agora.getMinutes();

}


/* =========================
   DESCOBRIR FAIXA
========================= */

function descobrirFaixa() {

    const agora = minutosAtuais();

    const hora = Math.floor(agora / 60);

    if (hora >= 0 && hora < 3)
        return "00-03";

    if (hora >= 3 && hora < 6)
        return "03-06";

    if (hora >= 6 && hora < 9)
        return "06-09";

    if (hora >= 9 && hora < 12)
        return "09-12";

    if (hora >= 12 && hora < 15)
        return "12-15";

    if (hora >= 15 && hora < 18)
        return "15-18";

    if (hora >= 18 && hora < 21)
        return "18-21";

    return "21-00";
}


/* =========================
   BUSCAR PROGRAMA PELO ID
========================= */

function buscarPrograma(id) {

    return programas.find(programa =>
        programa.id === id
    );

}


/* =========================
   TEXTO DO TIPO
========================= */

function formatarTipo(tipo) {

    if (!tipo)
        return "Programa";

    const tipos = {

        "filme": "Filme",

        "serie": "Série",

        "jornal": "Jornal",

        "documentario": "Documentário",

        "entretenimento": "Entretenimento",

        "esporte": "Esporte",

        "infantil": "Infantil",

        "reality": "Reality",

        "novela": "Novela"

    };

    return tipos[tipo.toLowerCase()] || tipo;

}


/* =========================
   CRIAR CANAL
========================= */

function criarCanal(canal, faixa) {

    const idPrograma =
        canal.programacao[faixa];

    if (!idPrograma) {

        return `
            <section class="canal">

                <div class="canal-header">

                    <div class="canal-info">

                        <div class="canal-id">
                            ${canal.canal}
                        </div>

                        <div>
                            <h2>${canal.canal}</h2>
                            <p>Canal de televisão</p>
                        </div>

                    </div>

                </div>

                <div class="vazio">
                    Nenhum programa cadastrado para esta faixa.
                </div>

            </section>
        `;

    }


    const programa =
        buscarPrograma(idPrograma);


    if (!programa) {

        return `
            <section class="canal">

                <div class="canal-header">

                    <div class="canal-info">

                        <div class="canal-id">
                            ${canal.canal}
                        </div>

                        <div>
                            <h2>${canal.canal}</h2>
                            <p>Canal de televisão</p>
                        </div>

                    </div>

                </div>

                <div class="erro">
                    O programa <strong>${idPrograma}</strong>
                    foi encontrado na grade, mas não existe no
                    Programa.json.
                </div>

            </section>
        `;

    }


    const imagem = programa.img_url
        ? `
            <img
                src="${programa.img_url}"
                alt="${programa.titulo}"
                onerror="this.parentElement.innerHTML='<div class=&quot;imagem-sem&quot;>Imagem indisponível</div>'"
            >
          `
        : `
            <div class="imagem-sem">
                Imagem indisponível
            </div>
          `;


    return `

        <section class="canal">

            <div class="canal-header">

                <div class="canal-info">

                    <div class="canal-id">
                        ${canal.canal}
                    </div>

                    <div>

                        <h2>${canal.canal}</h2>

                        <p>
                            Transmissão atual
                        </p>

                    </div>

                </div>


                <div class="faixa">

                    Faixa atual

                    <br>

                    <strong>
                        ${faixa}
                    </strong>

                </div>

            </div>


            <article class="programa">

                <div class="imagem">

                    ${imagem}

                </div>


                <div class="programa-info">

                    <span class="tipo">

                        ${formatarTipo(programa.tipo)}

                    </span>


                    <h3>
                        ${programa.titulo}
                    </h3>


                    <p class="texto">

                        ${programa.texto}

                    </p>


                    <div class="agora">

                        NO AR AGORA •

                        <strong>
                            ${programa.id}
                        </strong>

                    </div>

                </div>

            </article>

        </section>

    `;

}


/* =========================
   RENDERIZAR
========================= */

function renderizar() {

    const conteudo =
        document.getElementById("conteudo");


    if (!canais.length) {

        conteudo.innerHTML = `
            <div class="vazio">
                Nenhum canal cadastrado.
            </div>
        `;

        return;

    }


    const faixa =
        descobrirFaixa();


    let html = "";


    canais.forEach(canal => {

        html += criarCanal(
            canal,
            faixa
        );

    });


    conteudo.innerHTML = html;

}


/* =========================
   CARREGAR JSON
========================= */

async function carregarDados() {

    try {

        const respostaTV =
            await fetch("TVs.json");


        const respostaPrograma =
            await fetch("Programa.json");


        if (!respostaTV.ok) {

            throw new Error(
                "Não foi possível carregar TVs.json"
            );

        }


        if (!respostaPrograma.ok) {

            throw new Error(
                "Não foi possível carregar Programa.json"
            );

        }


        const dadosTV =
            await respostaTV.json();


        const dadosPrograma =
            await respostaPrograma.json();


        canais =
            dadosTV.canais || [];


        programas =
            dadosPrograma.programas || [];


        renderizar();


    } catch (erro) {

        document.getElementById("conteudo").innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a televisão.
                </strong>

                <br><br>

                ${erro.message}

                <br><br>

                Confira se:

                <br>

                • TVs.json está na mesma pasta;

                <br>

                • Programa.json está na mesma pasta;

                <br>

                • Os nomes dos arquivos estão corretos.

            </div>

        `;

        console.error(erro);

    }

}


/* =========================
   INICIALIZAÇÃO
========================= */

atualizarRelogio();

carregarDados();


/* Relógio */

setInterval(
    atualizarRelogio,
    1000
);


/*
   Verifica a programação
   a cada minuto.
*/

setInterval(
    renderizar,
    60000
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUMMUS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 30px 20px;
    text-align: center;
    background: #151515;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    color: #999;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: 30px auto;
}

.menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

button {
    padding: 18px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1b1b1b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #292929;
}

.principal {
    background: white;
    color: black;
}

.status,
.card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
}

.status p {
    color: #aaa;
    line-height: 1.5;
}

.resumo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.numero {
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 18px;
}

.numero small {
    display: block;
    color: #999;
    margin-bottom: 8px;
}

.numero strong {
    font-size: 24px;
}

.candidato {
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 12px;
}

.candidato-topo {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.nome {
    font-size: 20px;
    font-weight: bold;
}

.partido,
.matricula,
.detalhes {
    color: #999;
    font-size: 13px;
    margin-top: 6px;
}

.votos {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
}

.barra {
    height: 8px;
    background: #292929;
    border-radius: 20px;
    margin-top: 15px;
    overflow: hidden;
}

.barra div {
    height: 100%;
    background: white;
}

.erro {
    color: #ff6b6b;
}

</style>
</head>

<body>

<header>

    <h1>SUMMUS</h1>

    <p>
        Simulação da eleição no estado atual do mundo
    </p>

</header>

<div class="container">

    <div class="menu">

        <button onclick="irParaLicitante()">
            IR PARA LICITANTE
        </button>

        <button
            class="principal"
            onclick="simularVotacao()"
        >
            SIMULAR VOTAÇÃO
        </button>

    </div>

    <div class="status">

        <h2 id="statusTitulo">
            Sistema pronto
        </h2>

        <p id="statusTexto">
            O sistema irá cruzar Estados.json,
            Registro.json e Campanha.json.
        </p>

    </div>

    <div id="resultado"></div>

</div>


<script>

/* =====================================================
   ARQUIVOS
===================================================== */

const ARQUIVOS = {

    estados: "Estados.json",

    registro: "Registro.json",

    campanha: "Campanha.json"

};


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function irParaLicitante() {

    window.location.href = "Licitante.html";

}


/* =====================================================
   CARREGAR JSON
===================================================== */

async function carregarJSON(nome) {

    const resposta = await fetch(
        nome + "?v=" + Date.now()
    );

    if (!resposta.ok) {

        throw new Error(
            "Erro ao carregar " +
            nome +
            " (" +
            resposta.status +
            ")"
        );

    }

    return await resposta.json();

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* =====================================================
   OBJETIVOS
===================================================== */

function obterObjetivos(grupo) {

    if (!grupo) {
        return [];
    }

    if (!Array.isArray(grupo.objetivos)) {
        return [];
    }

    return grupo.objetivos;

}


/* =====================================================
   POPULAÇÃO
===================================================== */

function obterPopulacao(grupo) {

    const numero =
        Number(grupo?.populacao);

    if (
        Number.isFinite(numero) &&
        numero > 0
    ) {

        return numero;

    }

    return 0;

}


/* =====================================================
   ANALISAR OBJETIVO
=====================================================

Exemplo:

interesse:

+seguranca

campanha:

+seguranca

resultado:

+1


interesse:

-impostos

campanha:

-impostos

resultado:

+1


interesse:

+seguranca

campanha:

-seguranca

resultado:

-1

===================================================== */

function compararObjetivo(
    interesse,
    objetivosCampanha
) {

    const interesseTexto =
        String(interesse).trim();

    if (!interesseTexto) {
        return 0;
    }


    let sinalInteresse = "+";

    let nomeInteresse =
        interesseTexto;


    if (
        nomeInteresse.startsWith("+") ||
        nomeInteresse.startsWith("-")
    ) {

        sinalInteresse =
            nomeInteresse[0];

        nomeInteresse =
            nomeInteresse.substring(1);

    }


    nomeInteresse =
        normalizar(nomeInteresse);


    let pontos = 0;


    for (
        const objetivo of objetivosCampanha
    ) {

        let sinalObjetivo = "+";

        let nomeObjetivo =
            String(objetivo).trim();


        if (
            nomeObjetivo.startsWith("+") ||
            nomeObjetivo.startsWith("-")
        ) {

            sinalObjetivo =
                nomeObjetivo[0];

            nomeObjetivo =
                nomeObjetivo.substring(1);

        }


        nomeObjetivo =
            normalizar(nomeObjetivo);


        if (
            nomeObjetivo !==
            nomeInteresse
        ) {

            continue;

        }


        if (
            sinalObjetivo ===
            sinalInteresse
        ) {

            pontos++;

        } else {

            pontos--;

        }

    }


    return pontos;

}


/* =====================================================
   SIMULAÇÃO
===================================================== */

async function simularVotacao() {

    const titulo =
        document.getElementById(
            "statusTitulo"
        );

    const texto =
        document.getElementById(
            "statusTexto"
        );

    const resultado =
        document.getElementById(
            "resultado"
        );


    titulo.innerText =
        "Simulando eleição...";

    texto.innerText =
        "Lendo os dados do mundo atual.";

    resultado.innerHTML = "";


    try {

        /* =============================================
           CARREGAR
        ============================================= */

        const estadosJSON =
            await carregarJSON(
                ARQUIVOS.estados
            );

        const registroJSON =
            await carregarJSON(
                ARQUIVOS.registro
            );

        const campanhaJSON =
            await carregarJSON(
                ARQUIVOS.campanha
            );


        /* =============================================
           CANDIDATOS

           CORREÇÃO PRINCIPAL:

           Registro.json usa:

           "pessoas": [...]

        ============================================= */

        const pessoas =
            Array.isArray(
                registroJSON.pessoas
            )
                ? registroJSON.pessoas
                : [];


        const candidatos =
            pessoas.map(pessoa => ({

                matricula:
                    pessoa.matricula,

                nome:
                    pessoa.nome ||
                    pessoa.nome_completo ||
                    "Sem nome",

                partido:
                    pessoa.partido ||
                    "Sem partido",

                cidade:
                    pessoa.cidade || "",

                votos: 0,

                pontos: 0,

                grupos: 0

            }));


        /* =============================================
           CAMPANHAS

           Campanha.json usa:

           "campanhas": [...]

        ============================================= */

        const campanhas =
            Array.isArray(
                campanhaJSON.campanhas
            )
                ? campanhaJSON.campanhas
                : [];


        /* =============================================
           ESTADOS

           Estados.json usa:

           estados
              ↓
           cidades
              ↓
           grupos

        ============================================= */

        const estados =
            Array.isArray(
                estadosJSON.estados
            )
                ? estadosJSON.estados
                : [];


        if (
            candidatos.length === 0
        ) {

            throw new Error(
                "Nenhum candidato encontrado em Registro.json."
            );

        }


        if (
            estados.length === 0
        ) {

            throw new Error(
                "Nenhum estado encontrado em Estados.json."
            );

        }


        /* =============================================
           CONTADORES
        ============================================= */

        let totalEleitores = 0;

        let totalGrupos = 0;

        let totalCidades = 0;


        /* =============================================
           PERCORRER ESTADOS
        ============================================= */

        for (
            const estado of estados
        ) {


            const cidades =
                Array.isArray(
                    estado.cidades
                )
                    ? estado.cidades
                    : [];


            /* =========================================
               PERCORRER CIDADES
            ========================================= */

            for (
                const cidade of cidades
            ) {

                totalCidades++;


                /*
                   IMPORTANTE:

                   No seu Estados.json:

                   cidade.grupos

                   contém:

                   jovens
                   adultos
                   idosos
                */

                const grupos =
                    cidade.grupos;


                if (
                    !grupos ||
                    typeof grupos !== "object"
                ) {

                    continue;

                }


                const nomesGrupos = [
                    "jovens",
                    "adultos",
                    "idosos"
                ];


                /* =====================================
                   PERCORRER GRUPOS
                ===================================== */

                for (
                    const nomeGrupo
                    of nomesGrupos
                ) {


                    const grupo =
                        grupos[nomeGrupo];


                    if (!grupo) {
                        continue;
                    }


                    const populacao =
                        obterPopulacao(
                            grupo
                        );


                    const interesses =
                        obterObjetivos(
                            grupo
                        );


                    if (
                        populacao <= 0 ||
                        interesses.length === 0
                    ) {

                        continue;

                    }


                    totalEleitores +=
                        populacao;

                    totalGrupos++;


                    /* =================================
                       CALCULAR CADA CANDIDATO
                    ================================= */

                    const pontuacoes = [];


                    for (
                        const candidato
                        of candidatos
                    ) {


                        /*
                           Pegamos somente as campanhas
                           daquele candidato.

                           E somente naquela cidade.
                        */

                        const campanhasCidade =
                            campanhas.filter(
                                campanha => {

                                    return (

                                        String(
                                            campanha.candidato
                                        ) ===
                                        String(
                                            candidato.matricula
                                        )

                                        &&

                                        normalizar(
                                            campanha.cidade
                                        ) ===
                                        normalizar(
                                            cidade.nome
                                        )

                                    );

                                }
                            );


                        let pontos = 0;


                        /* =============================
                           INTERESSES
                        ============================= */

                        for (
                            const interesse
                            of interesses
                        ) {


                            /*
                               Junta todos os objetivos
                               das campanhas do candidato
                               naquela cidade.
                            */

                            for (
                                const campanha
                                of campanhasCidade
                            ) {

                                pontos +=
                                    compararObjetivo(
                                        interesse,
                                        campanha.objetivos || []
                                    );

                            }

                        }


                        pontuacoes.push({

                            candidato:
                                candidato,

                            pontos:
                                pontos

                        });

                    }


                    /* =================================
                       ENCONTRAR MAIOR
                    ================================= */

                    let maior =
                        Math.max(
                            ...pontuacoes.map(
                                item =>
                                    item.pontos
                            )
                        );


                    /*
                       Mesmo que ninguém tenha feito
                       campanha naquela cidade,
                       o grupo ainda possui voto.

                       Nesse caso todos terão 0,
                       então ocorre empate e os votos
                       são divididos.

                       Isso mantém a eleição funcionando
                       desde o início do jogo.
                    */


                    const vencedores =
                        pontuacoes.filter(
                            item =>
                                item.pontos ===
                                maior
                        );


                    if (
                        vencedores.length === 0
                    ) {

                        continue;

                    }


                    const votosPorCandidato =
                        populacao /
                        vencedores.length;


                    /* =================================
                       DISTRIBUIR VOTOS
                    ================================= */

                    for (
                        const vencedor
                        of vencedores
                    ) {

                        vencedor.candidato.votos +=
                            votosPorCandidato;

                        vencedor.candidato.pontos +=
                            vencedor.pontos;

                        vencedor.candidato.grupos++;

                    }

                }

            }

        }


        /* =============================================
           ORDENAR
        ============================================= */

        candidatos.sort(
            (a, b) =>
                b.votos - a.votos
        );


        const totalVotos =
            candidatos.reduce(
                (
                    soma,
                    candidato
                ) =>
                    soma +
                    candidato.votos,
                0
            );


        /* =============================================
           RESULTADO
        ============================================= */

        titulo.innerText =
            "Eleição simulada";


        texto.innerText =
            "Resultado calculado usando os interesses das cidades e as ações de campanha registradas atualmente.";


        let html = "";


        /* =============================================
           RESUMO
        ============================================= */

        html += `

            <div class="resumo">

                <div class="numero">

                    <small>
                        Estados
                    </small>

                    <strong>
                        ${estados.length}
                    </strong>

                </div>


                <div class="numero">

                    <small>
                        Cidades
                    </small>

                    <strong>
                        ${totalCidades}
                    </strong>

                </div>


                <div class="numero">

                    <small>
                        Grupos
                    </small>

                    <strong>
                        ${totalGrupos}
                    </strong>

                </div>


                <div class="numero">

                    <small>
                        Eleitores
                    </small>

                    <strong>
                        ${formatar(
                            totalEleitores
                        )}
                    </strong>

                </div>


                <div class="numero">

                    <small>
                        Candidatos
                    </small>

                    <strong>
                        ${candidatos.length}
                    </strong>

                </div>

            </div>

        `;


        /* =============================================
           CANDIDATOS
        ============================================= */

        for (
            let i = 0;
            i < candidatos.length;
            i++
        ) {


            const candidato =
                candidatos[i];


            const percentual =
                totalVotos > 0
                    ? (
                        candidato.votos /
                        totalVotos
                    ) * 100
                    : 0;


            html += `

                <div class="candidato">

                    <div class="candidato-topo">

                        <div>

                            <div class="nome">

                                ${i + 1}º —
                                ${escapar(
                                    candidato.nome
                                )}

                            </div>


                            <div class="partido">

                                Partido:
                                ${escapar(
                                    candidato.partido
                                )}

                            </div>


                            <div class="matricula">

                                Matrícula:
                                ${escapar(
                                    candidato.matricula
                                )}

                            </div>

                        </div>


                        <div class="votos">

                            ${formatar(
                                candidato.votos
                            )}

                            <br>

                            <small>
                                ${percentual.toFixed(2)}%
                            </small>

                        </div>

                    </div>


                    <div class="barra">

                        <div
                            style="
                                width:${percentual}%;
                            "
                        ></div>

                    </div>


                    <div class="detalhes">

                        Compatibilidade:
                        ${candidato.pontos}
                        pontos

                        <br>

                        Grupos conquistados:
                        ${candidato.grupos}

                    </div>

                </div>

            `;

        }


        /* =============================================
           EXPLICAÇÃO
        ============================================= */

        html += `

            <div class="card">

                <h3>
                    Como essa eleição funciona?
                </h3>

                <p>

                    Cada cidade possui jovens,
                    adultos e idosos.

                    Cada grupo possui três
                    objetivos.

                    O sistema cruza esses objetivos
                    com as ações registradas em
                    Campanha.json.

                </p>

                <p>

                    Se um candidato possui uma ação
                    que corresponde a um interesse,
                    ele recebe pontos.

                </p>

                <p>

                    O candidato mais compatível
                    recebe os votos daquele grupo.

                    Em caso de empate,
                    os votos são divididos.

                </p>

            </div>

        `;


        resultado.innerHTML =
            html;


    } catch (erro) {

        console.error(erro);


        titulo.innerText =
            "Erro na simulação";


        texto.innerHTML =
            `<span class="erro">
                ${escapar(
                    erro.message
                )}
            </span>`;


        resultado.innerHTML = `

            <div class="card">

                <h3>
                    Não foi possível realizar
                    a eleição.
                </h3>

                <p class="erro">

                    ${escapar(
                        erro.message
                    )}

                </p>

            </div>

        `;

    }

}


/* =====================================================
   FORMATAÇÃO
===================================================== */

function formatar(numero) {

    return Math.round(
        Number(numero) || 0
    ).toLocaleString(
        "pt-BR"
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto) {

    return String(
        texto ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
